# docker-compose for Stella — brings up MariaDB and the Stella server.
# Configuration is JSON-only (no environment variables for Stella itself):
# docker/appsettings.json and docker/plugin_*.json are mounted over the app.
# EF migrations run automatically on startup; static-data seeding and
# music_db.xml loading are triggered on demand from the WebUI "Data" page.

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: stella
      MARIADB_DATABASE: stella_kfc
      MARIADB_USER: stella
      MARIADB_PASSWORD: stella
    volumes:
      - stella-db:/var/lib/mysql
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  stella:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      # JSON-only configuration (no env vars). Edit these on the host and restart.
      - ./docker/appsettings.json:/app/appsettings.json:ro
      # Writable so the WebUI "Startup Flags" page can persist toggles
      # back to these files. Edit them on the host and restart to apply.
      - ./docker/plugin_core.json:/app/plugins/plugin_core.json
      - ./docker/plugin_kfc.json:/app/plugins/plugin_kfc.json
      # Writable, persisted seed directory. On first boot Docker copies the
      # image's Data/Seed/ (asphyxia_data.json, events_list.json, and
      # music_db.xml if it was present at build time) into this volume. The
      # WebUI "Data" page writes uploaded music_db.xml here, and it survives
      # container recreation.
      - stella-seed:/app/Data/Seed
    restart: unless-stopped

volumes:
  stella-db:
  stella-seed:
